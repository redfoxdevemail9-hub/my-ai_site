<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedFoxiq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">RF</span>
        <span class="brand-name">RedFoxiq</span>
      </div>
      <div class="topbar-actions">
        <button id="keyBtn" class="icon-btn" title="مفتاح API" aria-label="مفتاح API">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        </button>
        <button id="clearBtn" class="icon-btn" title="محادثة جديدة" aria-label="محادثة جديدة">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark">RF</div>
        <p>ابدأ محادثة جديدة مع RedFoxiq</p>
      </div>
    </main>

    <form id="chatForm" class="composer">
      <textarea
        id="userInput"
        rows="1"
        placeholder="اكتب رسالتك..."
        autocomplete="off"
        required
      ></textarea>
      <button type="submit" id="sendBtn" class="send-btn" aria-label="إرسال">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </form>
  </div>

  <!-- نافذة إدخال مفتاح API الخاص بالزائر -->
  <div id="keyModal" class="modal-overlay">
    <div class="modal">
      <h2>أدخل مفتاح API الخاص بك</h2>
      <p class="modal-desc">
        يُستخدم مفتاحك فقط أثناء هذه الجلسة داخل متصفحك، ولا يُرسل أو يُحفظ على أي خادم — يزول تلقائياً عند إغلاق الصفحة.
      </p>
      <input type="password" id="apiKeyInput" placeholder="ألصق مفتاحك هنا" autocomplete="off" />
      <button id="saveKeyBtn" class="modal-btn">حفظ ومتابعة</button>
      <p class="modal-hint" id="keyError"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
